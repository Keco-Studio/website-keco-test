<!DOCTYPE html>
<html>
<head>
<meta name="ext-resource-dependency" content="./assets/keco-logo.png" data-resource-id="kecoLogo" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/discord/4a4a5e" data-resource-id="social-discord" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/youtube/4a4a5e" data-resource-id="social-youtube" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/x/4a4a5e" data-resource-id="social-x" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/instagram/4a4a5e" data-resource-id="social-instagram" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/tiktok/4a4a5e" data-resource-id="social-tiktok" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/reddit/4a4a5e" data-resource-id="social-reddit" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/github/4a4a5e" data-resource-id="social-github" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preload" as="image" href="./assets/keco-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
html,body{margin:0;padding:0;background:#F9F9FD;}
*{box-sizing:border-box;}
a{color:#1a1a2e;text-decoration:none;}
a:hover{color:#4a5bb8;}
button{font:inherit;}
</style>
</helmet>
<div style="min-height:100vh;font-family:'Inter',system-ui,sans-serif;color:#0f0f1a;background:#FCFCFD url('./assets/home-bg.png') top center / 100% auto no-repeat;position:relative;overflow-x:clip;">
  <dc-import name="KecoNav" active="Tutorials" style="position:sticky;top:0;z-index:50;display:block;" hint-size="100%,96px"></dc-import>

  <section style="position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:36px clamp(20px,3vw,48px) 120px;">
    <div style="display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:-0.01em;color:#4a4a5e;">
      <span>Resources</span><span>/</span><span style="color:#0f0f1a;">Tutorials</span>
    </div>
    <h1 style="margin:14px 0 0;font-family:'DM Sans',sans-serif;font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-0.035em;">Tutorials</h1>
    <p style="margin:14px 0 0;max-width:680px;font-size:15px;line-height:1.6;letter-spacing:-0.015em;color:#15151f;text-wrap:pretty;">Explore curated video tutorials and practical guides from the Keco community, from getting started to mastering advanced workflows.</p>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:36px 0 28px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="7">
          <button onClick="{{ c.select }}" style="border:0;cursor:pointer;padding:5px 12px;border-radius:999px;background:{{ c.bg }};color:#0f0f1a;font-size:15px;letter-spacing:-0.02em;white-space:nowrap;" style-hover="background:#E6E5FA;">{{ c.label }}</button>
        </sc-for>
      </div>
      <a href="Keco Use Cases.dc.html" style="display:flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;letter-spacing:-0.02em;color:#0f0f1a;" style-hover="color:#4a5bb8;">Browse sample use cases<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M7.5 3.5L11 7l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 28px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
        <a href="{{ it.href }}" target="_blank" rel="noopener" style="display:flex;flex-direction:column;gap:12px;color:#0f0f1a;transition:transform .15s;" style-hover="color:#0f0f1a;transform:translateY(-3px);">
          <div style="position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(135deg,#E6E5FA 0 10px,#EEEDFB 10px 20px);box-shadow:0 4px 16px rgba(80,90,180,0.10);">
            <image-slot id="{{ it.slot }}" shape="rect" placeholder="tutorial thumbnail"></image-slot>
            <span style="position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,0.92);font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;letter-spacing:-0.02em;pointer-events:none;">{{ it.source }}</span>
            <span style="position:absolute;bottom:10px;right:10px;padding:3px 9px;border-radius:999px;background:rgba(15,15,26,0.78);color:#ffffff;font-size:14px;letter-spacing:-0.01em;pointer-events:none;">{{ it.dur }}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <span style="font-size:14px;letter-spacing:-0.01em;color:#4a5bb8;font-weight:500;">{{ it.cat }}</span>
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
              <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:17px;line-height:1.3;letter-spacing:-0.025em;text-wrap:pretty;">{{ it.title }}</span>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-top:3px;"><path d="M5 11l6-6M6 5h5v5" stroke="#4a4a5e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
            <span style="font-size:14px;letter-spacing:-0.01em;color:#4a4a5e;">{{ it.author }}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </section>
  <dc-import name="KecoFooter" style="display:block;" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'All' };
  items = [
    ['Getting started with Keco Studio in 10 minutes', 'YouTube', 'Keco Team', '10 min', 'Getting started'],
    ['Organizing game data with tables', 'YouTube', 'Keco Team', '14 min', 'Data & tables'],
    ['Importing spreadsheets without breaking references', 'Tech blog', 'Lena Park', '6 min read', 'Data & tables'],
    ['Designing a combat mechanic from scratch', 'YouTube', 'Rogue Forge', '22 min', 'Mechanics'],
    ['Balancing an RPG economy with simulations', 'Tech blog', 'Marco Ruiz', '9 min read', 'Balance'],
    ['Prompting the AI agent for dialogue tables', 'YouTube', 'Keco Team', '12 min', 'AI agent'],
    ['Build a pixel dungeon crawler with free packs', 'YouTube', '8bit Lab', '28 min', 'Sample games'],
    ['From template to playable card battler', 'Tech blog', 'Paper Co.', '11 min read', 'Sample games']
  ];
  renderVals() {
    const cats = ['All', 'Getting started', 'Data & tables', 'Mechanics', 'Balance', 'AI agent', 'Sample games'];
    const list = this.items.map(([title, source, author, dur, cat], i) => ({ title, source, author, dur, cat, slot: `tutorial-${i}`, href: source === 'YouTube' ? 'https://www.youtube.com/' : 'https://medium.com/' }))
      .filter(it => this.state.cat === 'All' || it.cat === this.state.cat);
    return {
      cats: cats.map(c => ({ label: c, bg: c === this.state.cat ? '#F4F3FC' : 'transparent', select: () => this.setState({ cat: c }) })),
      items: list
    };
  }
}
</script>
</body>
</html>
