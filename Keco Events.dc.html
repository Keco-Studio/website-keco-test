<!DOCTYPE html>
<html>
<head>
<meta name="ext-resource-dependency" content="./assets/keco-logo.png" data-resource-id="kecoLogo" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/discord/4a4a5e" data-resource-id="social-discord" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/youtube/4a4a5e" data-resource-id="social-youtube" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/x/4a4a5e" data-resource-id="social-x" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/instagram/4a4a5e" data-resource-id="social-instagram" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/tiktok/4a4a5e" data-resource-id="social-tiktok" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/reddit/4a4a5e" data-resource-id="social-reddit" />
<meta name="ext-resource-dependency" content="https://cdn.simpleicons.org/github/4a4a5e" data-resource-id="social-github" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preload" as="image" href="./assets/keco-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#F9F9FD;}
*{box-sizing:border-box;}
a{color:#1a1a2e;text-decoration:none;}
a:hover{color:#4a5bb8;}
button{font:inherit;}
</style>
</helmet>
<div style="min-height:100vh;font-family:'Inter',system-ui,sans-serif;color:#0f0f1a;background:#FCFCFD url('./assets/home-bg.png') top center / 100% auto no-repeat;position:relative;overflow-x:clip;">
  <dc-import name="KecoNav" active="Events" style="position:sticky;top:0;z-index:50;display:block;" hint-size="100%,96px"></dc-import>

  <section style="position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:36px clamp(20px,3vw,48px) 120px;">
    <div style="display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:-0.01em;color:#4a4a5e;">
      <a href="Keco Community.dc.html" style="color:#4a4a5e;">Community</a><span>/</span><span style="color:#0f0f1a;">Events</span>
    </div>
    <h1 style="margin:14px 0 0;font-family:'DM Sans',sans-serif;font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-0.035em;">Events</h1>
    <p style="margin:14px 0 0;max-width:680px;font-size:15px;line-height:1.6;letter-spacing:-0.015em;color:#15151f;text-wrap:pretty;">Join upcoming game jams, virtual sessions and in-person meetups, and catch up on launches and developer news from the Keco team.</p>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:36px 0 22px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <sc-for list="{{ types }}" as="t" hint-placeholder-count="5">
          <button onClick="{{ t.select }}" style="border:0;cursor:pointer;padding:5px 12px;border-radius:999px;background:{{ t.bg }};color:#0f0f1a;font-size:15px;letter-spacing:-0.02em;white-space:nowrap;" style-hover="background:#E6E5FA;">{{ t.label }}</button>
        </sc-for>
      </div>
      <div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#F4F3FC;">
        <sc-for list="{{ whens }}" as="w" hint-placeholder-count="2">
          <button onClick="{{ w.select }}" style="border:0;cursor:pointer;padding:5px 14px;border-radius:999px;background:{{ w.bg }};color:#0f0f1a;font-size:15px;letter-spacing:-0.02em;" style-hover="background:#ffffff;">{{ w.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <sc-for list="{{ events }}" as="e" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:clamp(16px,2.4vw,32px);flex-wrap:wrap;padding:20px 24px;border-radius:20px;background:rgba(255,255,255,0.8);border:1px solid #E6E5FA;box-shadow:0 6px 24px rgba(80,90,180,0.06);">
          <div style="flex-shrink:0;width:68px;display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:14px;background:#ECEBFA;">
            <span style="font-size:14px;letter-spacing:0.02em;color:#4a4a5e;">{{ e.mon }}</span>
            <span style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:26px;line-height:1.05;letter-spacing:-0.035em;">{{ e.day }}</span>
          </div>
          <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px;">
            <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:14px;letter-spacing:-0.01em;">
              <span style="padding:1px 10px;border-radius:999px;background:#E6E5FA;">{{ e.type }}</span>
              <span style="color:#4a4a5e;">{{ e.meta }}</span>
            </div>
            <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:17px;letter-spacing:-0.025em;">{{ e.title }}</span>
            <span style="font-size:15px;line-height:1.5;letter-spacing:-0.015em;color:#4a4a5e;text-wrap:pretty;">{{ e.desc }}</span>
          </div>
          <a href="#" style="flex-shrink:0;display:flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:14px;background:{{ e.btnBg }};border:1px solid #D2D3F5;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;letter-spacing:-0.02em;color:#0f0f1a;white-space:nowrap;" style-hover="background:#ECEBFA;color:#0f0f1a;">{{ e.cta }}</a>
        </div>
      </sc-for>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <p style="text-align:center;color:#4a4a5e;font-size:15px;padding:40px 0;">No events in this category yet.</p>
      </sc-if>
    </div>
  </section>
  <dc-import name="KecoFooter" style="display:block;" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { type: 'All', when: 'Upcoming' };
  data = [
    ['Upcoming','OCT','09','Virtual','Online · 10:00 PT','Keco Live: Balancing an RPG economy','A live walkthrough of economy simulations, with Q&A from the team.'],
    ['Upcoming','OCT','24','Game jam','Online · 72 hours','Keco Jam #3: One Mechanic','Build a game around a single mechanic. Top entries join Made with Keco.'],
    ['Upcoming','NOV','14','In person','San Francisco','Designers’ Night SF','An evening of short talks and playtests with local game designers.'],
    ['Upcoming','DEC','02','Launch','Online','Keco Studio 2.0 launch stream','See what’s new in the AI agent, templates, and team collaboration.'],
    ['Past','SEP','12','Virtual','Online','Getting started with data tables','Recording available on YouTube.'],
    ['Past','AUG','20','Game jam','Online · 48 hours','Keco Jam #2: Tiny Worlds','Winners announced in Made with Keco.']
  ];
  renderVals() {
    const { type, when } = this.state;
    const list = this.data.filter(d => d[0] === when && (type === 'All' || d[3] === type)).map(([w, mon, day, t, meta, title, desc]) => ({ mon, day, type: t, meta, title, desc, cta: w === 'Past' ? 'View recap' : (t === 'Game jam' ? 'Join jam' : 'RSVP'), btnBg: w === 'Past' ? '#ffffff' : '#F4F3FC' }));
    return {
      types: ['All', 'Virtual', 'In person', 'Game jam', 'Launch'].map(t => ({ label: t, bg: t === type ? '#F4F3FC' : 'transparent', select: () => this.setState({ type: t }) })),
      whens: ['Upcoming', 'Past'].map(w => ({ label: w, bg: w === when ? '#ffffff' : 'transparent', select: () => this.setState({ when: w }) })),
      events: list, empty: list.length === 0
    };
  }
}
</script>
</body>
</html>
